<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Đăng Nhập — Nông Ký VietGAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --page-bg:#141C15;
    --paper:#FBF8EF;
    --card:#FFFDF7;
    --ink:#232A1C;
    --ink-soft:#6E7862;
    --ink-faint:#9BA38C;
    --line: rgba(35,42,28,0.14);
    --header:#1F3626;
    --leaf:#2E5A2E;
    --leaf-bright:#3F6B3F;
    --clay:#A6512E;
    --gold:#D6A339;
    --gold-dark:#B8830E;
    --radius-lg: 20px;
    --radius-md: 12px;
    font-size: 16px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body{
    margin:0; padding:0;
    background: var(--page-bg);
    font-family:'Be Vietnam Pro', sans-serif;
    display:flex; justify-content:center;
    min-height:100vh;
    min-height:100dvh;
  }
  .app-shell{
    width:100%; max-width: 500px;
    min-height:100vh;
    min-height:100dvh;
    background: var(--paper);
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    display:flex; flex-direction:column;
    justify-content:space-between;
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .login-header{
    background: var(--header);
    color: #F6F1E2;
    padding: max(32px, env(safe-area-inset-top)) 20px 56px;
  }
  .header-top{
    display:flex; align-items:center; justify-content:space-between;
  }
  .brand-row{
    display:flex; align-items:center; gap:10px;
  }
  .app-logo{
    display: inline-flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; border-radius: 12px;
    background: #3F6B3F;
    border: 1px solid rgba(214,163,57,0.35);
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
  }
  .app-title{
    font-size: 1.5rem; font-weight: 800; letter-spacing: 0.02em;
    margin: 0; color: #F6F1E2;
  }
  .app-title em{ font-style:normal; color: var(--gold); }
  .vietgap-badge{
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.69rem;
    font-weight: 700;
    color: var(--gold);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .header-sub-block{
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .header-heading{
    font-size: 1.12rem; font-weight: 800; color: #F6F1E2; margin: 0 0 4px;
  }
  .header-desc{
    font-size: 0.82rem; color: rgba(246,241,226,0.75); margin: 0; line-height: 1.45;
  }

  .login-card{
    background: var(--card);
    border-radius: var(--radius-lg);
    margin: -32px 16px 0;
    padding: 22px 20px;
    box-shadow: 0 10px 28px rgba(35,42,28,0.1);
    border: 1px solid rgba(35,42,28,0.1);
  }
  .form-group{
    margin-bottom: 16px;
  }
  .form-label-row{
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px;
  }
  .form-label{
    font-size: 0.82rem; font-weight: 700;
    color: var(--ink);
  }
  .clear-link{
    font-size: 0.74rem; font-weight: 600; color: var(--ink-soft);
    cursor: pointer; border: none; background: none; padding: 0;
  }
  .clear-link:hover{ color: var(--ink); }
  .input-wrapper{
    position: relative;
    display: flex; align-items: center;
  }
  .input-icon{
    position: absolute; left: 14px;
    color: var(--ink-soft); pointer-events: none;
    display: flex; align-items: center;
  }
  .form-input{
    width: 100%;
    height: 50px;
    padding: 12px 14px 12px 42px;
    font-family: inherit; font-size: 16px;
    color: var(--ink);
    background: rgba(251, 248, 239, 0.7);
    border: 1.5px solid var(--line);
    border-radius: var(--radius-md);
    outline: none;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    font-weight: 500;
  }
  .form-input:focus{
    background: #FFFFFF;
    border-color: var(--leaf-bright);
    box-shadow: 0 0 0 3px rgba(63, 107, 63, 0.14);
  }
  .toggle-pwd{
    position: absolute; right: 10px;
    background: none; border: none; padding: 6px;
    color: var(--ink-faint); cursor: pointer;
    display: flex; align-items: center;
  }
  .toggle-pwd:hover{ color: var(--leaf-bright); }

  .options-row{
    display: flex; justify-content: space-between; align-items: center;
    margin: 4px 0 18px;
  }
  .remember-label{
    display: flex; align-items: center; gap: 8px;
    font-size: 0.82rem; font-weight: 500; color: var(--ink);
    cursor: pointer; user-select: none;
  }
  .remember-checkbox{
    width: 17px; height: 17px; border-radius: 5px;
    accent-color: var(--leaf-bright); cursor: pointer;
  }

  .error-box{
    display: none;
    background: #FBEAE1;
    border: 1px solid rgba(166, 81, 46, 0.25);
    color: var(--clay);
    padding: 11px 13px;
    border-radius: var(--radius-md);
    font-size: 0.82rem; font-weight: 600;
    margin-bottom: 16px;
    align-items: center; gap: 8px;
  }
  .error-box.show{ display: flex; }

  .btn-submit{
    width: 100%; height: 50px;
    border: none; border-radius: var(--radius-md);
    background: var(--leaf); color: #fff;
    font-family: inherit; font-size: 0.95rem; font-weight: 800;
    letter-spacing: 0.02em;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 4px 12px rgba(46, 90, 46, 0.28);
    transition: transform 0.1s, opacity 0.15s, background 0.15s;
  }
  .btn-submit:hover{ background: var(--leaf-bright); }
  .btn-submit:active{ transform: scale(0.99); }
  .btn-submit:disabled{ opacity: 0.65; cursor: not-allowed; }

  .quick-section{
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px dashed var(--line);
  }
  .quick-title{
    font-size: 0.69rem; font-weight: 700; text-transform: uppercase;
    color: var(--ink-soft); letter-spacing: 0.05em;
    margin-bottom: 10px; text-align: center;
  }
  .quick-grid{
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  }
  .quick-btn{
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    padding: 10px 12px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-family: inherit;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: var(--ink-soft);
  }
  .quick-btn:hover{
    background: rgba(63,107,63,0.08);
    border-color: var(--leaf-bright);
  }
  .quick-btn.active{
    background: rgba(63,107,63,0.12);
    border-color: var(--leaf-bright);
    color: var(--leaf);
  }
  .quick-role{ font-size: 0.81rem; font-weight: 700; color: var(--ink); }

  .login-footer{
    padding: 24px 20px 4px;
    text-align: center;
    font-size: 0.76rem; font-weight: 500; color: var(--ink-soft);
  }
  .spinner{
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="app-shell">
  <div>
    <div class="login-header">
      <div class="header-top">
        <div class="brand-row">
          <div class="app-logo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F6F1E2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 20h10"/>
              <path d="M10 20c5.5-2.5.8-6.4 3-13"/>
              <path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/>
              <path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>
            </svg>
          </div>
          <h1 class="app-title">nông<em>ký</em></h1>
        </div>
        <span class="vietgap-badge">Chuẩn VietGAP</span>
      </div>

      <div class="header-sub-block">
        <h2 class="header-heading">Đăng nhập hệ thống</h2>
        <p class="header-desc">Sổ nhật ký canh tác điện tử bằng giọng nói và hình ảnh</p>
      </div>
    </div>

    <div class="login-card">
      <div class="error-box" id="errorBox">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorMsg">Tên đăng nhập hoặc mật khẩu không chính xác.</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="username">Tài khoản nông hộ</label>
            <button type="button" class="clear-link" id="clearUserBtn" style="display:none;" onclick="clearUsername()">Xóa</button>
          </div>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input type="text" id="username" class="form-input" placeholder="Nhập tên đăng nhập..." required autofocus autocomplete="username" autocapitalize="none" autocorrect="off" oninput="onUserInput()">
          </div>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label class="form-label" for="password">Mật khẩu</label>
          </div>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input type="password" id="password" class="form-input" placeholder="Nhập mật khẩu..." required autocomplete="current-password" autocapitalize="none" autocorrect="off">
            <button type="button" class="toggle-pwd" onclick="togglePassword()" title="Hiện/ẩn mật khẩu">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="options-row">
          <label class="remember-label">
            <input type="checkbox" id="rememberMe" class="remember-checkbox" checked>
            <span>Ghi nhớ tài khoản trên thiết bị này</span>
          </label>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span>ĐĂNG NHẬP</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="quick-section">
        <div class="quick-title">Điền nhanh tài khoản thử nghiệm</div>
        <div class="quick-grid">
          <button type="button" class="quick-btn" id="btnFarmer" onclick="fillAccount('nongdan1', '123456', 'farmer')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="quick-role">Nông hộ (nongdan1)</span>
          </button>
          <button type="button" class="quick-btn" id="btnAdmin" onclick="fillAccount('admin', 'admin123', 'admin')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            <span class="quick-role">Quản trị (admin)</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="login-footer">
    Hệ thống Nông Ký VietGAP
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', () => {
  try {
    const savedUser = localStorage.getItem('nongky_remember_user');
    if (savedUser) {
      const uInput = document.getElementById('username');
      uInput.value = savedUser;
      onUserInput();
      if (savedUser === 'nongdan1') {
        document.getElementById('btnFarmer').classList.add('active');
      } else if (savedUser === 'admin') {
        document.getElementById('btnAdmin').classList.add('active');
      }
    }
  } catch(e){}
});

function onUserInput() {
  const val = document.getElementById('username').value;
  const btn = document.getElementById('clearUserBtn');
  btn.style.display = val ? 'inline' : 'none';
}

function clearUsername() {
  const uInput = document.getElementById('username');
  uInput.value = '';
  onUserInput();
  document.getElementById('btnFarmer').classList.remove('active');
  document.getElementById('btnAdmin').classList.remove('active');
  uInput.focus();
}

function togglePassword() {
  const pwd = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    icon.style.color = 'var(--leaf-bright)';
  } else {
    pwd.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    icon.style.color = '';
  }
}

function fillAccount(u, p, roleKey) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
  onUserInput();
  document.getElementById('errorBox').classList.remove('show');

  document.getElementById('btnFarmer').classList.toggle('active', roleKey === 'farmer');
  document.getElementById('btnAdmin').classList.toggle('active', roleKey === 'admin');

  document.getElementById('password').focus();
}

async function handleLogin(e) {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const remember = document.getElementById('rememberMe').checked;
  const errorBox = document.getElementById('errorBox');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  errorBox.classList.remove('show');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> Đang xác thực...';

  try {
    if (remember) {
      localStorage.setItem('nongky_remember_user', username);
    } else {
      localStorage.removeItem('nongky_remember_user');
    }
  } catch(e){}

  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok && data.status === 'success') {
      window.location.href = data.redirect || '/nongky';
    } else {
      errorMsg.textContent = data.message || 'Tên đăng nhập hoặc mật khẩu không chính xác.';
      errorBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<span>ĐĂNG NHẬP</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
    }
  } catch (err) {
    errorMsg.textContent = 'Không thể kết nối đến máy chủ hệ thống. Vui lòng thử lại.';
    errorBox.classList.add('show');
    submitBtn.disabled = false;
    submitBtn.innerHTML = '<span>ĐĂNG NHẬP</span> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
  }
}
</script>

</body>
</html>
